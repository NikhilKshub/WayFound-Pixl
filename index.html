<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wayfound</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Karla:ital,wght@0,200..800;1,200..800&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <header>
        <p>Wayfound</p>
        <nav>
            <button data-view="home">Home</button>
            <button data-view="library">Library</button>
            <button data-view="logbook">Logbook</button>
        </nav>
    </header>

    <section id="home">
        <div class="hero">
            <h1>Turn everyday life into <span>side quests</span></h1>
            <p>Small challenges to get you out there, try something new, and make your days more interesting.</p>
            <button id="surprise-btn">Surprise Me</button>
        </div>
            <h2>Today's quests</h2>
        <div id="todays-quests"></div>
    </section>

    <section id="library">
        <h2>Quest Library</h2>
        <div id="pack-list"></div>
        <div id="pack-quests"></div>
    </section>

    <section id="logbook">
        <h2>Logbook</h2>
        <p id="empty-message">No quests completed yet</p>
        <div id="log-list"></div>
    </section>

    <dialog id="quest-sheet">
        <div id="sheet-content"></div>
        <button id="close-sheet">Close</button>
    </dialog>

    <script src="quests-data.js"></script>
    <script src="script.js"></script>
  </body>




  </html>
